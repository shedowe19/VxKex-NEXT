name: Import complete upstream source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-upstream.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: standalone-source-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'shedowe19/VxKex-NEXT'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Import and verify the complete pinned source tree
        shell: bash
        env:
          UPSTREAM_COMMIT: 5df0008807f5b021625619093589b47710dbea38
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch VxKex.sln >/dev/null 2>&1; then
            echo "Source is already imported; refusing to overwrite existing project files."
            exit 0
          fi
          source_dir="$(mktemp -d)"
          git -C "$source_dir" init -q
          git -C "$source_dir" fetch --depth=1 https://github.com/YuZhouRen86/VxKex-NEXT.git "$UPSTREAM_COMMIT"
          actual_commit="$(git -C "$source_dir" rev-parse FETCH_HEAD)"
          test "$actual_commit" = "$UPSTREAM_COMMIT"
          git -C "$source_dir" archive "$UPSTREAM_COMMIT" | tar -xf - -C "$GITHUB_WORKSPACE"
          git -C "$source_dir" ls-tree -rz --full-tree "$UPSTREAM_COMMIT" > "$RUNNER_TEMP/upstream-tree.bin"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          manifest = Path(os.environ["RUNNER_TEMP"]) / "upstream-tree.bin"
          root = Path(os.environ["GITHUB_WORKSPACE"])
          count = 0
          total = 0
          for entry in manifest.read_bytes().split(b"\0"):
              if not entry:
                  continue
              metadata, name = entry.split(b"\t", 1)
              mode, kind, expected = metadata.split()
              if kind != b"blob":
                  raise SystemExit(f"Unsupported source object: {entry!r}")
              target = root / os.fsdecode(name)
              data = os.fsencode(os.readlink(target)) if mode == b"120000" else target.read_bytes()
              actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if actual != expected.decode():
                  raise SystemExit(f"Source hash mismatch: {os.fsdecode(name)}")
              count += 1
              total += len(data)
          if count != 539:
              raise SystemExit(f"Expected 539 upstream files, found {count}")
          print(f"Verified {count} upstream files, {total:,} bytes, including all binary assets.")
          PY
          cat > UPSTREAM.md <<'DOC'
          # Upstream source
          
          This independent repository starts from the complete source tree of
          [YuZhouRen86/VxKex-NEXT](https://github.com/YuZhouRen86/VxKex-NEXT),
          commit `5df0008807f5b021625619093589b47710dbea38` (release 1.2.3.2465).
          
          All 539 tracked upstream files, including import libraries, prebuilt DLLs,
          debugging symbols, documentation and build utilities, were copied and
          verified against their original Git blob hashes. Original author
          attribution and file headers are preserved.
          
          This is a standalone repository with its own history. The upstream
          project's GitHub issues and release records were reviewed, not imported
          as new GitHub issue objects or releases.
          
          Subsequent changes are recorded as separate commits. Existing Chromium
          sandbox compatibility behavior is retained unless explicitly changed.
          DOC
          # Workflow updates use the authorized repository connection separately.
          # The Actions job token can import contents, but cannot add workflows.
          rm -f .github/workflows/build.yml
          git add --all
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Import complete VxKex NEXT 1.2.3.2465 source snapshot"
          git push origin HEAD:main
